<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krealo Digital</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --text:#1f2430; --muted:#5b6475;
    --primary:#1a73c7; --border:#e4e7ec;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
    display:flex; min-height:100vh; align-items:center; justify-content:center;
  }
  .wrap{max-width:560px; margin:0 auto; padding:48px 20px; text-align:center;}
  h1{font-size:30px; margin:0 0 10px;}
  p{color:var(--muted); margin:0 0 24px; font-size:16px;}
  a.btn{
    display:inline-block; background:var(--primary); color:#fff; text-decoration:none;
    padding:12px 22px; border-radius:8px; font-weight:600; font-size:14px;
  }
  footer{color:var(--muted); font-size:13px; margin-top:40px;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Krealo Digital</h1>
    <p>Agencia de automatización e inteligencia artificial — Cartago, Colombia.</p>
    <a class="btn" href="https://www.krealo.digital/">Ir al sitio principal</a>
    <footer><a href="/politica-de-privacidad.html" style="color:inherit">Política de Privacidad</a></footer>
  </div>
</body>
</html>
